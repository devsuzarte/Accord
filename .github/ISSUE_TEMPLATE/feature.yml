name: Idea or feature
description: Propose something new (open this before sending a big PR)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
      description: The real situation where you miss it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you picture it
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I want to send the pull request for this
