name: Something doesn't work
description: Report a problem in Accord (security issues go through SECURITY.md)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Host a channel with a password
        2. A friend joins through the invite
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Accord version
      description: You tab › Updates, or the installer's file name.
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows
      placeholder: Windows 11 23H2
  - type: dropdown
    id: network
    attributes:
      label: How you connect
      options:
        - Same network
        - Radmin VPN
        - Tailscale
        - Another VPN
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If you can, attach main.log (Accord's logs folder). Remove passwords and IPs first.
