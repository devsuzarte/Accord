# Confere o código a cada envio: tipos, lint e formatação. Grátis em repositório público.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Tipos
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Formatação
        run: bunx prettier --check .
