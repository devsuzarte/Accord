# Builds the installer on a real Windows machine and publishes the version to GitHub Releases.
#
# How to use: raise the version in the three package.json files, commit, and then
#   - on the website: Actions → Release → Run workflow → tick "Publish the version"; or
#   - with git: git tag v0.3.0 && git push origin v0.3.0
# Without ticking "Publish", a manual run only builds the installer as an artifact.
# A tag with a hyphen (e.g. v0.3.0-beta.1) becomes a pre-release: it doesn't reach automatic updates.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the version (creates the v<version> tag and the release)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  LIVEKIT_VERSION: 1.13.11

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) {
            Write-Error "The tag ($tag) does not match the version in apps/desktop/package.json ($version)."
            exit 1
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the voice server (LiveKit) and verify the checksum
        shell: pwsh
        run: |
          $v = $env:LIVEKIT_VERSION
          $base = "https://github.com/livekit/livekit/releases/download/v$v"
          $zip = "livekit_${v}_windows_amd64.zip"
          Invoke-WebRequest "$base/$zip" -OutFile $zip
          Invoke-WebRequest "$base/checksums.txt" -OutFile checksums.txt
          $expected = (Select-String -Path checksums.txt -Pattern ([regex]::Escape($zip))).Line.Split(' ')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { Write-Error "The LiveKit checksum does not match."; exit 1 }
          New-Item -ItemType Directory -Force infra/bin | Out-Null
          Expand-Archive $zip -DestinationPath livekit-tmp -Force
          $exe = Get-ChildItem livekit-tmp -Recurse -Filter livekit-server.exe | Select-Object -First 1
          Copy-Item $exe.FullName infra/bin/livekit-server.exe

      - name: Build the server and the installer
        run: bun run package

      - name: Publish the version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref }}".StartsWith('refs/tags/v')) {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = 'v' + (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Error "Release $tag already exists. Raise the version in the package.json files before publishing."
              exit 1
            }
            $global:LASTEXITCODE = 0
          }
          $version = $tag.TrimStart('v')
          $files = @(
            "release/app/Accord-Setup-$version.exe",
            "release/app/Accord-Setup-$version.exe.blockmap",
            "release/app/latest.yml"
          )
          $extra = @()
          if ($tag.Contains('-')) { $extra += '--prerelease' } else { $extra += '--latest' }
          # --target: with no tag yet (manual run), gh creates the tag on this commit.
          gh release create $tag @files --title "Accord $version" --generate-notes --target "${{ github.sha }}" @extra

      - name: Keep the files (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accord-windows
          path: |
            release/app/*.exe
            release/app/*.blockmap
            release/app/latest.yml
